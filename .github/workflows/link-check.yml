# A curated list dies of link rot, and a list full of 404s is worse than no list
# — it is evidence the maintainer stopped looking. This runs weekly so decay
# shows up as an issue rather than as a reader's dead end.
name: link check

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["README.md"]

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 429 and 403 are usually a bot wall rather than a dead link, so they
          # are accepted — flagging them would train everyone to ignore the run.
          args: --verbose --no-progress --accept 200,206,429,403 README.md
          fail: false
      - name: Open an issue on failure
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead links found in README
          content-filepath: ./lychee/out.md
          labels: link-rot
